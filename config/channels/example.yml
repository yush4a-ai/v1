# Шаблон профиля канала. Скопируйте в <имя_канала>.yml, чтобы настроить
# язык именно под этот канал. Если файла для канала нет — используются
# дефолты (primary_language: ru, expected: [ru, en], suspicious: []).
#
# ВАЖНО: suspicious_languages НЕ означает "бан за язык". Это означает
# "для этого канала данный язык может повышать risk score внутри кластера,
# наравне с остальными слабыми сигналами". См. cigilbot/detectors/language.py
# и раздел 9 docs/moderation-plan.md.

channel_profile:
  primary_language: ru

  expected_languages:
    - ru
    - en

  suspicious_languages:
    - pl
    - cs
    - sk

# Автоклип: секция необязательна, по умолчанию enabled: false (канал
# должен явно включить). Три независимых триггера — любой сработавший
# создаёт клип через Twitch Helix. cooldown_seconds общий для burst и
# keyword; голосовая команда стримера его не учитывает.
# См. src/bot/autoclip_config.py.
autoclip:
  enabled: false
  cooldown_seconds: 300

  burst:
    enabled: true
    window_seconds: 20
    unique_authors_threshold: 12

  keyword:
    enabled: true
    phrases:
      - "клип это"
      - "клип"
      - "clip it"
      - "clip that"

  voice:
    enabled: true
    phrases:
      - "клип это"
      - "заклипай"
      - "clip it"
      - "clip that"
