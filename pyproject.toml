# Конфигурация инструментов разработки плюс минимальный [build-system]/
# [project] — не ради публикации пакета (dependencies намеренно пустой,
# requirements.txt остаётся единственным источником правды по зависимостям),
# а ради `pip install -e .`: bot/, cigilbot/, panel/ переехали под src/, и
# без editable install интерпретатор не видит их как импортируемые пакеты
# (Python добавляет в sys.path каталог запускаемого скрипта, не src/).
#
# Файлов конфига было три, по одному на каталог в apps/. Каталог теперь
# один, и вместе с ним исчезли mypy_path через ../ и необходимость держать
# три набора одинаковых правил ruff синхронными руками.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cigilbot-monorepo"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.hatch.build.targets.wheel]
# paths — пакет (src/paths/__init__.py), не одиночный файл: force-include
# копирует одиночные файлы в site-packages вместо editable-редиректа, из-за
# чего Path(__file__) в них после установки указывает на .venv, а не на
# src/ (см. докстринг src/paths/__init__.py). Пакет с одним __init__.py
# получает честный editable-редирект — та же гарантия, что и у остальных.
packages = ["src/bot", "src/cigilbot", "src/panel", "src/paths"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "__pycache__", "var", "prompts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "C4",  # comprehensions
]
ignore = [
    "E501",  # длину строк держит formatter, дублировать проверку не нужно
    "B008",  # вызовы в дефолтах аргументов — норма для FastAPI Depends
]

[tool.ruff.lint.per-file-ignores]
# В тестах допустимы длинные литералы-фикстуры и «магические» числа порогов
"tests/**" = ["E402"]
# Скрипты запускаются как файлы, а не как модули пакета, и правят sys.path
# до импортов — порядок намеренный.
"scripts/**" = ["E402", "I001"]
# SIM103 в _is_skip_reply: прямой возврат условия отдал бы объект Match от
# SILENCE_PATTERN.match(), а не bool, как объявлено в сигнатуре. Цепочка
# guard-clause'ов здесь и честнее по типу, и читается ровнее.
"src/bot/brain.py" = ["SIM103"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# DeprecationWarning из СВОЕГО кода — ошибка. Раньше это были две отдельные
# настройки в двух конфигах (cigilbot.* и panel.*), теперь один список.
filterwarnings = [
    "error::DeprecationWarning:cigilbot.*",
    "error::DeprecationWarning:panel.*",
]
markers = [
    "slow: тесты на реальных данных из БД (прогон истории чата)",
]

[tool.mypy]
# bot/ здесь нет намеренно: чат-бот писался без аннотаций, и включать его
# значит утонуть в шуме. panel/bots_api.py — тот же непроверяемый код,
# просто переехавший в пакет панели (бывшая панель нейроботов).
files = [
    "src/cigilbot",
    "src/paths",
    "src/panel/auth.py",
    "src/panel/moderation_api.py",
    "src/panel/registry_api.py",
    "src/panel/server.py",
    "tests",
]
python_version = "3.12"
strict = true
warn_unreachable = true
# editable install кладёт cigilbot/bot/panel/paths в site-packages как
# редиректы на src/ (см. докстринг src/paths/__init__.py), но mypy_path
# указан явно и здесь: mypy резолвит импорты не так, как интерпретатор,
# и не всегда подхватывает editable-хуки сам.
mypy_path = "src"

# Библиотеки без типов — не наша забота
[[tool.mypy.overrides]]
module = ["lingua.*", "twitchio.*", "aiosqlite.*", "streamlink.*"]
ignore_missing_imports = true

# bot.* и panel.bots_api не аннотированы (см. files выше). follow_imports =
# "skip", а не только ignore_missing_imports: модули лежат рядом и потому
# НАХОДИМЫ, а значит mypy начал бы их разбирать по ссылкам из проверяемого
# кода и выдавать ошибки в том, что проверять не просили.
[[tool.mypy.overrides]]
module = ["bot.*", "panel.bots_api"]
follow_imports = "skip"
ignore_errors = true
ignore_missing_imports = true
